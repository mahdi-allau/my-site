<header [class]="headerClass()">
  <nav class="container-page flex h-18 items-center justify-between gap-6 py-4" aria-label="Navigazione principale">
    <a routerLink="/" (click)="closeMenu()" class="group flex items-center gap-3">
      <span
        class="grid h-9 w-9 place-items-center rounded-lg bg-accent-400 font-display text-lg text-ink-950"
        aria-hidden="true"
      >M</span>
      <span class="flex flex-col leading-tight">
        <span class="text-[0.95rem] font-semibold text-white">Mahdi Allau</span>
        <span class="text-[0.7rem] tracking-wide text-muted">Sviluppo web</span>
      </span>
    </a>

    <!-- Desktop -->
    <div class="hidden items-center gap-1 md:flex">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="text-accent-400"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          class="rounded-full px-4 py-2 text-sm font-medium text-muted transition-colors hover:text-white"
        >{{ link.label }}</a>
      }
    </div>

    <div class="hidden md:block">
      <a routerLink="/contact" class="btn btn-primary btn-sm">Parliamone</a>
    </div>

    <!-- Mobile -->
    <button
      type="button"
      class="grid h-10 w-10 place-items-center rounded-lg border border-line text-white md:hidden"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="menu-mobile"
      [attr.aria-label]="menuOpen() ? 'Chiudi il menù' : 'Apri il menù'"
      (click)="toggleMenu()"
    >
      @if (menuOpen()) {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-5 w-5" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-5 w-5" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round" />
        </svg>
      }
    </button>
  </nav>

  @if (menuOpen()) {
    <div id="menu-mobile" class="container-page pb-6 md:hidden">
      <div class="flex flex-col gap-1">
        @for (link of links; track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="text-accent-400"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            (click)="closeMenu()"
            class="rounded-lg px-3 py-3 text-base font-medium text-muted-strong transition-colors hover:bg-ink-850 hover:text-white"
          >{{ link.label }}</a>
        }
        <a routerLink="/contact" (click)="closeMenu()" class="btn btn-primary mt-3 w-full">Parliamone</a>
      </div>
    </div>
  }
</header>
