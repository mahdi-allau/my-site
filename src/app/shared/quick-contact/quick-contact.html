@if (hasAny()) {
  @if (variant() === 'floating') {
    <!-- Solo su telefono: chi naviga da mobile è a un tocco dallo scrivere -->
    <div class="floating">
      @if (whatsapp()) {
        <a [href]="waHref()" target="_blank" rel="noopener noreferrer"
           class="fab fab-wa" [attr.aria-label]="i18n.t('contact.whatsapp')">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20zm4.4-5.9c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1-.2.2-.6.8-.7.9-.1.2-.3.2-.5.1a6.6 6.6 0 0 1-3.2-2.8c-.2-.4.2-.4.6-1.2.1-.1 0-.3 0-.4l-.7-1.7c-.2-.4-.4-.4-.5-.4h-.5a1 1 0 0 0-.7.3c-.2.3-.9.9-.9 2.1s.9 2.5 1 2.6c.1.2 1.8 2.7 4.3 3.8 1.6.7 2.2.7 3 .6.5-.1 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1z"/>
          </svg>
        </a>
      }
      @if (phone()) {
        <a [href]="telHref()" class="fab fab-tel" [attr.aria-label]="i18n.t('contact.callUs')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z"
                  stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>
      }
    </div>
  } @else {
    <ul class="inline-list">
      @if (phone()) {
        <li>
          <a [href]="telHref()" class="row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span>
              <span class="row-label">{{ i18n.t('contact.callUs') }}</span>
              <span class="row-value">{{ phone() }}</span>
            </span>
          </a>
        </li>
      }
      @if (whatsapp()) {
        <li>
          <a [href]="waHref()" target="_blank" rel="noopener noreferrer" class="row">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20zm4.4-5.9c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1-.2.2-.6.8-.7.9-.1.2-.3.2-.5.1a6.6 6.6 0 0 1-3.2-2.8c-.2-.4.2-.4.6-1.2.1-.1 0-.3 0-.4l-.7-1.7c-.2-.4-.4-.4-.5-.4h-.5a1 1 0 0 0-.7.3c-.2.3-.9.9-.9 2.1s.9 2.5 1 2.6c.1.2 1.8 2.7 4.3 3.8 1.6.7 2.2.7 3 .6.5-.1 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1z"/>
            </svg>
            <span>
              <span class="row-label">{{ i18n.t('contact.whatsapp') }}</span>
              <span class="row-value">{{ whatsapp() }}</span>
            </span>
          </a>
        </li>
      }
    </ul>
  }
}
