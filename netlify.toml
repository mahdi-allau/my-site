# Configurazione per Netlify.
#
# Serve sia se colleghi il repository (Netlify legge questo file e sa già
# cosa fare) sia come promemoria di come va pubblicato il sito.

[build]
  command = "npm run build"
  publish = "dist/my-site/browser"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------
# Il sito è una single page application: il percorso lo risolve Angular,
# non il server. Senza questa regola aprire /services direttamente darebbe
# 404, perché quel file non esiste sul disco.
# ---------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------
# Intestazioni di sicurezza.
# ---------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # Impedisce che il sito venga incorniciato in un altro sito, tecnica
    # usata per far cliccare all'utente cose che non vede.
    X-Frame-Options = "DENY"
    # Il browser non deve indovinare il tipo di un file: se il server dice
    # che è testo, non va eseguito come script.
    X-Content-Type-Options = "nosniff"
    # Verso siti esterni non passa l'indirizzo completo della pagina.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Funzioni del dispositivo che il sito non usa e non deve poter chiedere.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Da dove il browser può caricare le cose. Tutto dal sito stesso,
    # tranne i caratteri di Google e le chiamate a Supabase.
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data:;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co;
      frame-ancestors 'none';
      base-uri 'self';
      form-action 'self'"""

# I file col codice nel nome cambiano nome a ogni build: si possono tenere
# in cache per sempre.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html invece deve essere sempre riscaricato, altrimenti dopo una
# pubblicazione il browser continuerebbe a servire la versione vecchia.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
